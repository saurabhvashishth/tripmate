apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: expense-data
  namespace: tripmate
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: tripmate-nfs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-service
  namespace: tripmate
  labels: { app: expense-service }
spec:
  replicas: 1
  # SQLite is single-writer, so keep a single replica. Recreate avoids two
  # pods briefly writing the same SQLite file on the shared NFS volume during
  # a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: expense-service }
  template:
    metadata:
      labels: { app: expense-service }
    spec:
      containers:
        - name: expense-service
          image: ghcr.io/saurabhvashishth/tripmate-expense-service:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DB_PATH
              value: /data/expenses.db
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
      volumes:
        # Durable SQLite storage on an NFS volume (see 05-storageclass.yaml).
        - name: data
          persistentVolumeClaim:
            claimName: expense-data
---
apiVersion: v1
kind: Service
metadata:
  name: expense-service
  namespace: tripmate
spec:
  selector: { app: expense-service }
  ports:
    - port: 3000
      targetPort: 3000
