apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tripmate
  namespace: tripmate
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
spec:
  rules:
    - http:
        paths:
          # nginx in the frontend pod reverse-proxies /api/* to the backend
          # services, so all traffic can terminate at the frontend Service.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
