apiVersion: v1
kind: ServiceAccount
metadata:
  name: photo-service
  namespace: tripmate
  annotations:
    # Filled from Terraform output `photo_irsa_role_arn` (see README).
    eks.amazonaws.com/role-arn: ${PHOTO_SA_ROLE_ARN}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: photo-service
  namespace: tripmate
  labels: { app: photo-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: photo-service }
  template:
    metadata:
      labels: { app: photo-service }
    spec:
      serviceAccountName: photo-service
      containers:
        - name: photo-service
          image: ghcr.io/saurabhvashishth/tripmate-photo-service:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: AWS_REGION
              value: ap-south-1
            - name: PHOTO_BUCKET
              value: ${PHOTO_BUCKET}
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: photo-service
  namespace: tripmate
spec:
  selector: { app: photo-service }
  ports:
    - port: 3000
      targetPort: 3000
