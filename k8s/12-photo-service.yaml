apiVersion: apps/v1
kind: Deployment
metadata:
  name: photo-service
  namespace: tripmate
  labels: { app: photo-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: photo-service }
  template:
    metadata:
      labels: { app: photo-service }
    spec:
      containers:
        - name: photo-service
          image: ghcr.io/saurabhvashishth/tripmate-photo-service:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            # MinIO is S3-compatible; point the AWS SDK at it with path-style
            # addressing and static credentials from the minio-credentials Secret.
            - name: S3_ENDPOINT
              value: http://minio.tripmate.svc.cluster.local:9000
            - name: S3_FORCE_PATH_STYLE
              value: "true"
            # Browser-reachable MinIO endpoint used only to sign GET URLs.
            # Set this to the MinIO Ingress host you expose (see 20-ingress.yaml).
            - name: S3_PUBLIC_ENDPOINT
              value: http://minio.tripmate.local
            - name: AWS_REGION
              value: us-east-1
            - name: PHOTO_BUCKET
              value: tripmate-photos
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: minio-credentials, key: MINIO_ROOT_USER }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: minio-credentials, key: MINIO_ROOT_PASSWORD }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: photo-service
  namespace: tripmate
spec:
  selector: { app: photo-service }
  ports:
    - port: 3000
      targetPort: 3000
