server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # allow photo uploads up to 12MB (service caps at 10MB)
  client_max_body_size 12m;

  # ---- API routing to microservices (Kubernetes Service DNS names) ----------
  # Note: order matters. More specific /api/expenses and /api/photos come first.

  location /api/expenses {
    proxy_pass http://expense-service:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # expense-service also owns payments, cross-trip balances, and the activity feed
  location /api/payments {
    proxy_pass http://expense-service:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/balances {
    proxy_pass http://expense-service:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/activity {
    proxy_pass http://expense-service:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/photos {
    proxy_pass http://photo-service:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/trips {
    proxy_pass http://trip-service:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # ---- Static SPA -----------------------------------------------------------
  # Never cache the app shell / scripts / config, so a new deploy is picked up
  # on the next reload without a hard refresh. (These files are small.)
  location ~* \.(?:html|js|css)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires -1;
    try_files $uri =404;
  }

  location / {
    # index.html served here (directly or via SPA fallback) must not be cached.
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
